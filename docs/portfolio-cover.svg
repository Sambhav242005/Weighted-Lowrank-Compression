<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#4a9eff" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="100" y1="0" x2="100" y2="760"/>
    <line x1="200" y1="0" x2="200" y2="760"/>
    <line x1="300" y1="0" x2="300" y2="760"/>
    <line x1="400" y1="0" x2="400" y2="760"/>
    <line x1="500" y1="0" x2="500" y2="760"/>
    <line x1="600" y1="0" x2="600" y2="760"/>
    <line x1="700" y1="0" x2="700" y2="760"/>
    <line x1="800" y1="0" x2="800" y2="760"/>
    <line x1="900" y1="0" x2="900" y2="760"/>
    <line x1="1000" y1="0" x2="1000" y2="760"/>
    <line x1="1100" y1="0" x2="1100" y2="760"/>
  </g>

  <!-- Ambient glow -->
  <circle cx="300" cy="380" r="200" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="900" cy="380" r="200" fill="url(#glow2)" filter="url(#blur)"/>

  <!-- Title -->
  <text x="600" y="80" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">ResearchCompression</text>
  <text x="600" y="115" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="16" fill="#888" text-anchor="middle" letter-spacing="2">TRANSFORMER WEIGHT COMPRESSION STUDY</text>

  <!-- Pipeline flow -->
  <g transform="translate(100, 180)">
    <!-- Original Dense Weights -->
    <rect x="0" y="0" width="180" height="120" rx="12" fill="#12121a" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="90" y="40" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#4a9eff" text-anchor="middle" font-weight="600">DENSE WEIGHTS</text>
    <text x="90" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Pretrained</text>
    <text x="90" y="75" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Transformer</text>
    <g opacity="0.6">
      <rect x="30" y="90" width="120" height="18" rx="3" fill="#4a9eff" opacity="0.2"/>
      <rect x="30" y="90" width="80" height="18" rx="3" fill="#4a9eff" opacity="0.3"/>
      <rect x="30" y="90" width="45" height="18" rx="3" fill="#4a9eff" opacity="0.5"/>
    </g>

    <!-- Arrow -->
    <path d="M 200 60 L 250 60" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="225" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#555" text-anchor="middle">compress</text>

    <!-- Compressed Representation -->
    <rect x="270" y="0" width="180" height="120" rx="12" fill="#12121a" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="360" y="40" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ff6b6b" text-anchor="middle" font-weight="600">COMPRESSED</text>
    <text x="360" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Compact</text>
    <text x="360" y="75" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Representation</text>
    <g opacity="0.6">
      <rect x="300" y="90" width="120" height="18" rx="3" fill="#ff6b6b" opacity="0.2"/>
      <rect x="300" y="90" width="50" height="18" rx="3" fill="#ff6b6b" opacity="0.3"/>
      <rect x="300" y="90" width="25" height="18" rx="3" fill="#ff6b6b" opacity="0.5"/>
    </g>

    <!-- Arrow -->
    <path d="M 470 60 L 520 60" stroke="#444" stroke-width="2" fill="none"/>
    <text x="495" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#555" text-anchor="middle">reconstruct</text>

    <!-- Reconstructed -->
    <rect x="540" y="0" width="180" height="120" rx="12" fill="#12121a" stroke="#44ff88" stroke-width="1.5"/>
    <text x="630" y="40" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#44ff88" text-anchor="middle" font-weight="600">RECONSTRUCTED</text>
    <text x="630" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Layer Output</text>
    <text x="630" y="75" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">vs Original</text>
    <g opacity="0.6">
      <rect x="570" y="90" width="120" height="18" rx="3" fill="#44ff88" opacity="0.2"/>
      <rect x="570" y="90" width="85" height="18" rx="3" fill="#44ff88" opacity="0.3"/>
      <rect x="570" y="90" width="50" height="18" rx="3" fill="#44ff88" opacity="0.5"/>
    </g>
  </g>

  <!-- Drift visualization -->
  <g transform="translate(100, 340)">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#888" font-weight="600">HIDDEN-STATE DRIFT ACCUMULATION</text>

    <!-- Layer blocks showing drift -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="700" height="50" rx="6" fill="#1a1a2e" stroke="#333" stroke-width="0.5"/>
      <g>
        <rect x="10" y="10" width="50" height="30" rx="4" fill="#4a9eff" opacity="0.9"/>
        <text x="35" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L0</text>

        <rect x="70" y="10" width="50" height="30" rx="4" fill="#4a9eff" opacity="0.85"/>
        <text x="95" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L1</text>

        <rect x="130" y="10" width="50" height="30" rx="4" fill="#5ab0ff" opacity="0.8"/>
        <text x="155" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L2</text>

        <rect x="190" y="10" width="50" height="30" rx="4" fill="#6bc0ff" opacity="0.75"/>
        <text x="215" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L3</text>

        <rect x="250" y="10" width="50" height="30" rx="4" fill="#ffaa44" opacity="0.7"/>
        <text x="275" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L4</text>

        <rect x="310" y="10" width="50" height="30" rx="4" fill="#ff8844" opacity="0.7"/>
        <text x="335" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L5</text>

        <rect x="370" y="10" width="50" height="30" rx="4" fill="#ff6644" opacity="0.7"/>
        <text x="395" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L6</text>

        <rect x="430" y="10" width="50" height="30" rx="4" fill="#ff4444" opacity="0.7"/>
        <text x="455" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L7</text>

        <rect x="490" y="10" width="50" height="30" rx="4" fill="#ff2222" opacity="0.7"/>
        <text x="515" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L8</text>

        <rect x="550" y="10" width="50" height="30" rx="4" fill="#ff0000" opacity="0.7"/>
        <text x="575" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">L9</text>

        <rect x="610" y="10" width="80" height="30" rx="4" fill="#cc0000" opacity="0.7"/>
        <text x="650" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">FAILS</text>
      </g>

      <!-- Drift label -->
      <text x="710" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#888">drift</text>
      <path d="M 700 25 L 710 30 L 700 35" stroke="#888" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Legend -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#44ff88" opacity="0.7"/>
      <text x="15" y="9" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#666">Success</text>

      <rect x="80" y="0" width="10" height="10" rx="2" fill="#ffaa44" opacity="0.7"/>
      <text x="95" y="9" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#666">Degrading</text>

      <rect x="170" y="0" width="10" height="10" rx="2" fill="#ff4444" opacity="0.7"/>
      <text x="185" y="9" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#666">Failure</text>
    </g>
  </g>

  <!-- Metrics panel -->
  <g transform="translate(100, 500)">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#888" font-weight="600">EVALUATION METRICS</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="200" height="70" rx="8" fill="#12121a" stroke="#333" stroke-width="0.5"/>
      <text x="100" y="25" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#666" text-anchor="middle">Perplexity Delta</text>
      <text x="100" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#4a9eff" text-anchor="middle" font-weight="700">+12.3</text>
      <text x="100" y="65" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#ff6b6b" text-anchor="middle">baseline comparison</text>

      <rect x="220" y="0" width="200" height="70" rx="8" fill="#12121a" stroke="#333" stroke-width="0.5"/>
      <text x="320" y="25" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#666" text-anchor="middle">Logit KL Divergence</text>
      <text x="320" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#ff6b6b" text-anchor="middle" font-weight="700">2.84</text>
      <text x="320" y="65" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#ff6b6b" text-anchor="middle">higher = worse</text>

      <rect x="440" y="0" width="200" height="70" rx="8" fill="#12121a" stroke="#333" stroke-width="0.5"/>
      <text x="540" y="25" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#666" text-anchor="middle">Storage Savings</text>
      <text x="540" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#44ff88" text-anchor="middle" font-weight="700">4.2x</text>
      <text x="540" y="65" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#44ff88" text-anchor="middle">compression ratio</text>

      <rect x="660" y="0" width="200" height="70" rx="8" fill="#12121a" stroke="#333" stroke-width="0.5"/>
      <text x="760" y="25" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#666" text-anchor="middle">Peak Memory</text>
      <text x="760" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#ffaa44" text-anchor="middle" font-weight="700">+18%</text>
      <text x="760" y="65" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#ffaa44" text-anchor="middle">over baseline</text>
    </g>
  </g>

  <!-- Key finding callout -->
  <g transform="translate(100, 630)">
    <rect x="0" y="0" width="1000" height="90" rx="10" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="20" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#ff6b6b" font-weight="700">CENTRAL THESIS</text>
    <text x="20" y="52" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ccc">Strong local approximations do not compose — hidden-state representation drift accumulates across layers.</text>
    <text x="20" y="72" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ccc">Success at a single layer is insufficient evidence; global behavior must be validated.</text>
  </g>
</svg>
